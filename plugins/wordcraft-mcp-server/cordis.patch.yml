# DeepSeek Harness: run WordCraft Bridge through Harness's MCP client (tools appear as mcp__wordcraft__<tool>).
- insert:
    - id: wordcraft-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: wordcraft
        transport: stdio
        command: node
        args:
          - !!js "process.getBuiltinModule('url').fileURLToPath(new URL('node_modules/wordcraft-mcp-server/dist/bundle.cjs', baseUrl))"
        toolCallTimeoutMs: 3600000
