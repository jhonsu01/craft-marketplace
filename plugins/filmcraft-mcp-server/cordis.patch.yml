# DeepSeek Harness: run FilmCraft Bridge through Harness's MCP client (tools appear as mcp__filmcraft__<tool>).
- insert:
    - id: filmcraft-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: filmcraft
        transport: stdio
        command: node
        args:
          - !!js "process.getBuiltinModule('url').fileURLToPath(new URL('node_modules/filmcraft-mcp-server/dist/bundle.cjs', baseUrl))"
        toolCallTimeoutMs: 3600000
