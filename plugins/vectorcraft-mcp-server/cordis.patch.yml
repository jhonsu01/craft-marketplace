# DeepSeek Harness: run VectorCraft Bridge through Harness's MCP client (tools appear as mcp__vectorcraft__<tool>).
- insert:
    - id: vectorcraft-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vectorcraft
        transport: stdio
        command: node
        args:
          - !!js "process.getBuiltinModule('url').fileURLToPath(new URL('node_modules/vectorcraft-mcp-server/dist/bundle.cjs', baseUrl))"
        toolCallTimeoutMs: 3600000
