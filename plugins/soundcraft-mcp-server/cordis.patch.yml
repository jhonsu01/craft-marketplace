# DeepSeek Harness: run SoundCraft Bridge through Harness's MCP client (tools appear as mcp__soundcraft__<tool>).
- insert:
    - id: soundcraft-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: soundcraft
        transport: stdio
        command: node
        args:
          - !!js "process.getBuiltinModule('url').fileURLToPath(new URL('node_modules/soundcraft-mcp-server/dist/bundle.cjs', baseUrl))"
        toolCallTimeoutMs: 3600000
