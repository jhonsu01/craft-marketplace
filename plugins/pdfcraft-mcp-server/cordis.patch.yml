# DeepSeek Harness: run PdfCraft Bridge through Harness's MCP client (tools appear as mcp__pdfcraft__<tool>).
- insert:
    - id: pdfcraft-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pdfcraft
        transport: stdio
        command: node
        args:
          - !!js "process.getBuiltinModule('url').fileURLToPath(new URL('node_modules/pdfcraft-mcp-server/dist/bundle.cjs', baseUrl))"
        toolCallTimeoutMs: 3600000
